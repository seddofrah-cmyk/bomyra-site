<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b2a">
<title>BOMYRA — Connect Extension</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#17445a 0,transparent 55%),#061522;color:#f3f8fa;font:16px/1.6 Inter,system-ui,sans-serif}.card{width:min(540px,100%);padding:36px;border:1px solid #244253;border-radius:22px;background:#0c2232;text-align:center}.mark{margin:auto;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#20d5d2,#4c83d8);color:#061522;font-size:25px;font-weight:950}.muted{color:#a8bdc8}.status{margin-top:20px;padding:14px;border:1px solid #315064;border-radius:10px;color:#cde0e8;overflow-wrap:anywhere}.status.error{border-color:#a85e56;color:#ffb2a8}.status.success{border-color:#287f75;color:#9af0df}.btn{display:inline-block;margin-top:20px;padding:12px 20px;border-radius:10px;background:#20d5d2;color:#06202a;text-decoration:none;font-weight:800}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth/config.js"></script>
</head>
<body>
<main class="card">
<div class="mark">B</div>
<h1>Connect BOMYRA extension</h1>
<p class="muted">Authorize this browser extension to check your Free or Pro export allowance. Your conversations and exported content are not sent during account linking.</p>
<div class="status" id="status" role="status" aria-live="polite">Checking your BOMYRA account…</div>
<a class="btn" id="continue" href="../../" hidden>Return to BOMYRA</a>
</main>
<script>
(async()=>{
 const status=document.getElementById("status"),link=document.getElementById("continue");
 const params=new URLSearchParams(location.search),code=params.get("code")||"";
 const fail=message=>{status.className="status error";status.textContent=message;};
 if(!/^[A-Za-z0-9_-]{40,100}$/.test(code)){fail("This connection link is invalid. Return to the extension and start again.");return;}
 if(!window.supabase||!window.BOMYRA_SUPABASE_URL||!window.BOMYRA_SUPABASE_ANON_KEY){fail("Account connection is temporarily unavailable.");return;}
 const client=window.supabase.createClient(window.BOMYRA_SUPABASE_URL,window.BOMYRA_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 try{
  const {data,error}=await client.auth.getSession();if(error)throw error;
  if(!data.session){
   const next=location.pathname+location.search;
   location.replace("../../auth/?next="+encodeURIComponent(next));return;
  }
  status.textContent="Authorizing this extension…";
  const response=await fetch("https://bomyra-backend.vercel.app/api/extension/pair/approve",{
   method:"POST",headers:{"Authorization":"Bearer "+data.session.access_token,"Content-Type":"application/json"},body:JSON.stringify({code})
  });
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(result.error||"Could not connect the extension.");
  status.className="status success";status.textContent="Your BOMYRA account is now connected. Return to the extension to finish setup.";
  link.hidden=false;
 }catch(error){fail(error&&error.message?error.message:"Could not connect the extension. Please try again.");}
})();
</script>
</body></html>
