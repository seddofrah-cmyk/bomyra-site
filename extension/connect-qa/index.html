<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061522">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>BOMYRA — QA Extension Connection</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#17445a 0,transparent 55%),#061522;color:#f3f8fa;font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(540px,100%);padding:clamp(25px,5vw,38px);border:1px solid #285064;border-radius:22px;background:linear-gradient(150deg,#102b3d,#0a1d2b);text-align:center;box-shadow:0 26px 70px #0005,inset 0 1px #ffffff12}
.mark{width:76px;height:76px;margin:0 auto 14px;display:grid;place-items:center}
.mark img{width:100%;height:100%;object-fit:contain}
.eyebrow{color:#20d5d2;font-size:11px;font-weight:850;letter-spacing:.16em}
h1{margin:12px 0;color:#f3f8fa;font-size:clamp(25px,5vw,32px);font-weight:850;letter-spacing:-.035em;line-height:1.2}
.muted{max-width:420px;margin:0 auto;color:#a8bdc8}
.status{margin-top:22px;padding:14px 16px;border:1px solid #315064;border-radius:12px;background:#071a28;color:#cde0e8;overflow-wrap:anywhere}
.status.error{border-color:#a85e56;color:#ffb2a8}
.status.success{border-color:#287f75;color:#9af0df}
.account{display:flex;align-items:center;gap:12px;margin-top:20px;padding:14px;text-align:start;border:1px solid #315064;border-radius:14px;background:#071a28}
.avatar{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#20d5d2,#83e9d9);color:#06202a;font-weight:900}
.account-copy{min-width:0;display:flex;flex-direction:column;gap:3px}
.account-copy strong{overflow-wrap:anywhere;color:#f3f8fa;font-size:14px}
.account-copy small{color:#9bb4c1;font-size:11px}
.actions{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:44px;padding:11px 16px;border:1px solid transparent;border-radius:10px;background:linear-gradient(100deg,#20d5d2,#83e9d9);color:#06202a;text-decoration:none;font:inherit;font-weight:850;cursor:pointer}
.btn.secondary{border-color:#315064;background:#102b3d;color:#d9e8ee}
.btn:disabled{opacity:.6;cursor:wait}
.btn[hidden],.account[hidden],.actions[hidden]{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth/config.js"></script>
</head>
<body>
<main class="card">
<div class="mark"><img src="../../assets/images/bomyra-mark.svg" alt="BOMYRA"></div>
<div class="eyebrow">CONTROLLED QA FLOW</div>
<h1>Connect your BOMYRA extension</h1>
<p class="muted">Authorize this extension session with your BOMYRA account. The account-pairing flow uses the Cloudflare QA Worker; it does not call the former Vercel backend.</p>
<div class="status" id="status" role="status" aria-live="polite">Checking your BOMYRA account…</div>
<section class="account" id="accountCard" aria-label="BOMYRA account" hidden>
  <div class="avatar" id="accountAvatar" aria-hidden="true">B</div>
  <div class="account-copy"><strong id="accountEmail"></strong><small id="accountLabel">Currently signed in to BOMYRA</small></div>
</section>
<div class="actions" id="accountActions" hidden>
  <button class="btn" id="approve" type="button">Continue with this account</button>
  <button class="btn secondary" id="switchAccount" type="button">Use another account</button>
</div>
<a class="btn" id="continue" href="../../" hidden>Return to BOMYRA</a>
</main>
<script>
(async()=>{
 const status=document.getElementById("status");
 const returnLink=document.getElementById("continue");
 const accountCard=document.getElementById("accountCard");
 const accountEmail=document.getElementById("accountEmail");
 const accountAvatar=document.getElementById("accountAvatar");
 const accountActions=document.getElementById("accountActions");
 const approveButton=document.getElementById("approve");
 const switchButton=document.getElementById("switchAccount");
 const params=new URLSearchParams(location.search);
 const code=params.get("code")||"";
 const returnPath=location.pathname+location.search;
 const siteStartedFlow=params.get("flow")==="site";
 // Keep the one-time pairing code in memory only, not in browser history.
 try{history.replaceState(null,"",location.pathname);}catch(_){}
 const fail=message=>{status.className="status error";status.textContent=message;};
 window.addEventListener("message",event=>{
  if(event.source!==window||event.origin!==location.origin)return;
  const message=event.data;
  if(!message||message.source!=="bomyra-extension-bridge")return;
  if(message.type==="PAIRING_WAITING"&&siteStartedFlow){
   status.className="status";
   status.textContent=message.message||"Account approved. Waiting for BOMYRA to finish connecting the extension…";
  }else if(message.type==="PAIRING_COMPLETE"&&siteStartedFlow){
   status.className="status success";
   status.textContent="BOMYRA is now connected to this browser for "+(message.email||"your account")+". Return to your AI chat to use the extension.";
   accountActions.hidden=true;
   returnLink.hidden=false;
   returnLink.textContent="Return to BOMYRA";
  }else if(message.type==="PAIRING_FAILED"&&siteStartedFlow){
   fail(message.message||"The account was approved, but the extension could not finish connecting. Start a new connection from BOMYRA.");
   accountActions.hidden=true;
   returnLink.hidden=false;
  }
 });
 const initials=value=>{
  const parts=String(value||"B").split("@")[0].split(/[._ -]+/).filter(Boolean);
  return ((parts[0]||"B")[0]+(parts[1]||"")[0]).toUpperCase();
 };
 if(!/^[A-Za-z0-9_-]{40,100}$/.test(code)){
  fail("This QA connection link is invalid or expired. Return to the extension and start again.");
  return;
 }
 const pendingConnectKey="bomyra.extension.pendingConnectPath";
 function clearPendingConnectPath(){
  try{
   const stored=localStorage.getItem(pendingConnectKey);
   if(stored===returnPath)localStorage.removeItem(pendingConnectKey);
  }catch(_){}
 }
 // Keep the pairing destination available if the user opens the site's
 // general Sign in/Get Started route before completing this authorization.
 try{localStorage.setItem(pendingConnectKey,returnPath);}catch(_){}
 if(!window.supabase||!window.BOMYRA_SUPABASE_URL||!window.BOMYRA_SUPABASE_ANON_KEY){
  fail("Account connection is temporarily unavailable.");
  return;
 }
 const client=window.supabase.createClient(
  window.BOMYRA_SUPABASE_URL,
  window.BOMYRA_SUPABASE_ANON_KEY,
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
 );
 async function showSignedInAccount(){
  const {data,error}=await client.auth.getSession();
  if(error)throw error;
  if(!data.session){
   location.replace("../../auth/?next="+encodeURIComponent(returnPath));
   return null;
  }
  const user=data.session.user;
  const email=user.email||"BOMYRA account";
  const displayName=user.user_metadata?.full_name||user.user_metadata?.name||email;
  accountEmail.textContent=email;
  accountAvatar.textContent=initials(displayName);
  accountCard.hidden=false;
  accountActions.hidden=false;
  status.className="status";
  status.textContent="Review the BOMYRA account that will be linked to this browser extension.";
  return data.session;
 }
 async function approveCurrentAccount(){
  approveButton.disabled=true;
  switchButton.disabled=true;
  try{
   const {data,error}=await client.auth.getSession();
   if(error)throw error;
   if(!data.session){
    location.replace("../../auth/?next="+encodeURIComponent(returnPath));
    return;
   }
   const email=data.session.user.email||"this BOMYRA account";
   status.textContent="Authorizing "+email+" with the Cloudflare QA Worker…";
   const response=await fetch("https://bomyra-entitlements-qa.seddofrah.workers.dev/api/extension/pair/approve",{
    method:"POST",
    headers:{
     "Authorization":"Bearer "+data.session.access_token,
     "Content-Type":"application/json"
    },
    body:JSON.stringify({code}),
    cache:"no-store",
    credentials:"omit"
   });
   const result=await response.json().catch(()=>({}));
   if(!response.ok){
    const messages={
     AUTH_REQUIRED:"Your session has expired. Sign in again and restart the connection.",
     "Invalid pairing code":"This QA connection code is invalid or has expired. Start again from the extension.",
     "Pairing code is invalid, expired, or already used":"This QA connection code has expired or was already used. Start a new connection from the extension."
    };
    throw new Error(messages[result.error]||"The Cloudflare QA Worker could not approve this connection.");
   }
   status.className=siteStartedFlow?"status":"status success";
   status.textContent=siteStartedFlow
    ?"Account approved. Waiting for BOMYRA to finish connecting the extension…"
    :"The extension is now authorized for "+email+". Return to the extension to finish setup.";
   clearPendingConnectPath();
   accountActions.hidden=true;
   returnLink.hidden=!siteStartedFlow;
  }catch(error){
   fail(error&&error.message?error.message:"QA account authorization failed. Please try again.");
   approveButton.disabled=false;
   switchButton.disabled=false;
  }
 }
 approveButton.addEventListener("click",approveCurrentAccount);
 switchButton.addEventListener("click",async()=>{
  switchButton.disabled=true;
  approveButton.disabled=true;
  status.textContent="Switching the signed-in BOMYRA account…";
  try{
   // Local scope clears only this browser's Supabase session, not other devices.
   const {error}=await client.auth.signOut({scope:"local"});
   if(error)throw error;
   location.replace("../../auth/?next="+encodeURIComponent(returnPath));
  }catch(error){
   fail(error&&error.message?error.message:"Could not switch accounts. Please try again.");
   switchButton.disabled=false;
   approveButton.disabled=false;
  }
 });
 try{await showSignedInAccount();}
 catch(error){fail(error&&error.message?error.message:"Could not verify the signed-in account.");}
})();
</script>
</body>
</html>
