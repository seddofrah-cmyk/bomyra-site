name: Deploy BOMYRA website

on:
  push:
    branches:
      - main
    paths:
      - "website_payload/*.b64"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode and unpack the static website
        run: |
          mkdir -p site
          cat website_payload/*.b64 | tr -d '\r\n ' | base64 --decode > /tmp/bomyra-site.zip
          unzip -q /tmp/bomyra-site.zip -d site
          test -s site/index.html
          test -s site/privacy.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
