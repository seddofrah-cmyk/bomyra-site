<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2a">
  <title>BOMYRA — Secure Payment</title>
  <style>
    :root{color-scheme:dark;--bg:#061522;--panel:#102b3d;--line:#244253;--ink:#f3f8fa;--muted:#a8bdc8;--teal:#20d5d2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% -15%,#17445a 0,transparent 50%),var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(560px,100%);padding:32px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#102b3d,#0a1d2b);box-shadow:0 24px 70px #0005}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;font-weight:900;letter-spacing:.16em}
    .brand img{width:40px;height:40px;object-fit:contain}
    h1{margin:0 0 12px;font-size:clamp(26px,6vw,36px);line-height:1.15;letter-spacing:-.04em}
    p{margin:0;color:var(--muted)}
    .status{margin-top:24px;padding:14px 16px;border:1px solid #244253;border-radius:12px;background:#061522;color:#b8d0da;font-size:14px}
    .status.error{border-color:#a67b36;color:#f1d59c}
    a{display:inline-block;margin-top:24px;color:var(--teal);text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script src="./config.js"></script>
</head>
<body>
  <main>
    <div class="brand"><img src="../assets/images/bomyra-mark.svg" alt=""><span>BOMYRA</span></div>
    <h1>Secure payment</h1>
    <p>This page securely opens payment links issued by Paddle for BOMYRA.</p>
    <div id="status" class="status" role="status" aria-live="polite">Preparing secure checkout…</div>
    <a href="../pricing/">Return to BOMYRA plans</a>
  </main>
  <script>
    (function () {
      const status = document.getElementById("status");
      const params = new URLSearchParams(window.location.search);
      const transactionId = params.get("_ptxn");
      const token = window.BOMYRA_PADDLE_LIVE_CLIENT_TOKEN;

      function fail(message) {
        status.classList.add("error");
        status.textContent = message;
      }

      if (!transactionId || !/^txn_[a-zA-Z0-9]+$/.test(transactionId)) {
        fail("This payment link is missing a valid transaction reference. Please reopen the payment link from Paddle.");
        return;
      }

      if (typeof token !== "string" || !/^live_[a-zA-Z0-9]{27}$/.test(token)) {
        fail("Secure checkout is not active yet. Please try again later or contact BOMYRA support.");
        return;
      }

      if (!window.Paddle) {
        fail("The secure checkout service could not be loaded. Please refresh this page or try again later.");
        return;
      }

      try {
        // Production is Paddle.js default. Do not set the Sandbox environment here.
        // Paddle.js automatically opens the transaction from the _ptxn URL parameter.
        Paddle.Initialize({
          token,
          checkout: {
            settings: {
              displayMode: "overlay",
              theme: "dark",
              locale: "en"
            }
          }
        });
        status.textContent = "Opening your secure Paddle checkout…";
      } catch (error) {
        fail("Secure checkout could not be initialized. Please contact BOMYRA support.");
      }
    })();
  </script>
</body>
</html>
