<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b2a"><title>BOMYRA — Confirming account</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#17445a 0,transparent 55%),#061522;color:#f3f8fa;font:16px/1.6 Inter,system-ui,sans-serif}.card{width:min(540px,100%);padding:36px;border:1px solid #244253;border-radius:22px;background:#0c2232;text-align:center}.mark{margin:auto;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#20d5d2,#4c83d8);color:#061522;font-size:25px;font-weight:950}.muted{color:#a8bdc8}.status{margin-top:20px;padding:12px;border:1px solid #315064;border-radius:10px;color:#cde0e8}.btn{display:inline-block;margin-top:20px;padding:12px 20px;border-radius:10px;background:#20d5d2;color:#06202a;text-decoration:none;font-weight:800}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script></head>
<body><main class="card"><div class="mark">B</div><h1>Confirming your account</h1><p class="muted">Please wait while we securely complete your BOMYRA sign-in.</p><div class="status" id="status" role="status" aria-live="polite">Checking confirmation…</div><a class="btn" id="continue" href="../../" hidden>Continue to BOMYRA</a></main>
<script>
(async()=>{const el=document.getElementById("status"),link=document.getElementById("continue");
function safeNextPath(value){if(!value)return "../../";try{const target=new URL(value,location.origin);if(target.origin!==location.origin||!target.pathname.startsWith("/bomyra-site/"))return "../../";return target.pathname+target.search+target.hash;}catch{return "../../";}}const cfg=window.BOMYRA_SUPABASE_URL&& !window.BOMYRA_SUPABASE_URL.includes("YOUR_PROJECT_REF")&&window.BOMYRA_SUPABASE_ANON_KEY&&!window.BOMYRA_SUPABASE_ANON_KEY.includes("YOUR_SUPABASE");if(!window.supabase||!cfg){el.textContent="Supabase client configuration is incomplete. Please contact BOMYRA support.";return;}const client=window.supabase.createClient(window.BOMYRA_SUPABASE_URL,window.BOMYRA_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});try{const {data,error}=await client.auth.getSession();if(error)throw error;if(!data.session)throw new Error("The confirmation link is invalid, expired, or already used. Please request a new one.");el.textContent="Your email is confirmed and your account is ready.";let next="../../";try{next=safeNextPath(localStorage.getItem("bomyra.auth.next"));localStorage.removeItem("bomyra.auth.next");}catch{}link.href=next;link.hidden=false;}catch(e){el.textContent=e.message||"We could not confirm this session. Please try signing in again.";}})();
</script></body></html>
